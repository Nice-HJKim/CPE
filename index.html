<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS SAA 모의시험</title><style>:root{--blue:#0738c8;--light:#2e91f3;--ink:#17243a;--line:#cbd3df;--paper:#edf0f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}header{display:flex;background:var(--blue);color:white;min-height:100px;align-items:stretch}.title{padding:22px 28px;flex:1;font-weight:700;font-size:22px;line-height:1.35}.title span{font-size:16px;white-space:nowrap}.title small{display:block;font-size:14px;font-weight:400;margin-top:8px;letter-spacing:.04em}.clock{min-width:190px;border-left:1px solid #ffffff80;text-align:right;padding:12px 28px;display:flex;flex-direction:column;gap:3px}.clock span{font-size:12px}.clock strong{font-size:28px;font-variant-numeric:tabular-nums}.clock.urgent{background:#a92736}.strip{display:flex;justify-content:space-between;background:var(--light);color:white;padding:9px 28px;font-size:13px}main{max-width:1260px;margin:0 auto;padding:32px 32px 120px;min-height:calc(100vh - 200px)}h1,h2,p{margin-top:0}h1{font-size:30px;line-height:1.45}button,input,select{font:inherit}button{cursor:pointer;padding:12px 22px;border:1px solid #aeb9cb;background:white;color:var(--ink);border-radius:3px;font-weight:600}button:hover{background:#e4efff}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f1a833;outline-offset:3px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#00299e}.intro{max-width:780px;margin:22px auto;background:white;border:1px solid var(--line);padding:40px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.16em;font-weight:bold;margin-bottom:16px}.muted{color:#637188;line-height:1.7}.stats{display:flex;gap:32px;border-block:1px solid var(--line);padding:22px 0;margin:28px 0}.stats strong{display:block;font-size:23px;margin-bottom:5px}.stats span{font-size:13px;color:#637188}.fields{display:grid;grid-template-columns:1fr 180px;gap:20px;margin:28px 0}label.field{display:block;font-size:14px;font-weight:600}input[type=text],select{display:block;margin-top:10px;padding:13px;width:100%;border:1px solid #9daac0;border-radius:3px;background:white}.intro .primary{width:100%}.note{font-size:12px;color:#637188;margin-top:16px;line-height:1.6}.tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.english{background:var(--light);color:white;border-color:#1870c9}.question-title{font-size:14px;color:#5e6c82;letter-spacing:.02em}.question,.option-text{font-family:'Batang','바탕','AppleMyungjo','Nanum Myeongjo',serif;font-size:19px;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere}.question{white-space:pre-line;margin-bottom:25px}.choices{border:0;margin:0;padding:0;min-width:0}.choices legend{font-size:13px;color:#56647a;margin-bottom:12px}.option{display:flex;gap:13px;padding:15px 17px;border:1px solid transparent;border-bottom-color:#d5dbe2;cursor:pointer}.option:hover{background:#e2e8f0}.option:has(input:checked){border:1px solid #6794f2;background:#e0ebff;border-radius:3px}.option input{width:20px;height:20px;flex:none;margin-top:8px;accent-color:var(--blue)}.option-text{font-size:17px}.letter{font-family:Arial,sans-serif;font-weight:bold;margin-right:8px}.question-bottom{display:flex;justify-content:space-between;margin-top:22px;align-items:center;font-size:13px}.question-bottom button{font-size:12px;padding:8px 12px}.flag{font-size:14px;display:flex;gap:8px;align-items:center}.flag input{accent-color:var(--blue);width:17px;height:17px}footer{position:fixed;bottom:0;left:0;right:0;min-height:66px;background:var(--blue);display:flex;align-items:stretch;color:white;z-index:2}footer button{background:transparent;color:white;border:0;border-right:1px solid #ffffff70;border-radius:0;padding:18px 30px;font-size:17px}footer button:hover{background:#194ed8}footer .spacer{flex:1;align-self:center;padding:0 20px;font-size:13px;color:#d5e3ff}.review-summary{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.pill{padding:9px 14px;background:white;border:1px solid var(--line);font-size:14px;border-radius:3px}.review-table{width:100%;border-collapse:collapse;background:white}.review-table th{text-align:left;background:#dfe6f0;font-size:13px;padding:14px}.review-table td{padding:12px 14px;border-bottom:1px solid #e0e5ec;font-size:14px}.review-table button{padding:8px 14px;color:var(--blue)}.answered{color:#13715d}.unanswered{color:#a55b12}.result{max-width:700px;margin:24px auto;background:white;border:1px solid var(--line);padding:40px;text-align:center}.score{font-size:78px;color:var(--blue);font-weight:700;margin:20px 0}.score small{font-size:22px;color:#637188}.result-grid{display:flex;justify-content:center;gap:40px;margin:25px 0}.result-grid strong{display:block;font-size:24px}.result-grid span{font-size:13px;color:#637188}dialog{width:min(900px,94vw);max-height:85vh;padding:0;border:0;border-radius:5px;box-shadow:0 16px 80px #0005}dialog::backdrop{background:#152239a8}.dialog-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:var(--blue);color:white}.dialog-head h2{font-size:19px;margin:0}.dialog-head button{background:transparent;border:0;color:white;padding:7px}#modalBody{padding:26px;line-height:1.8;white-space:pre-line}#modalBody p{margin-bottom:16px}#modalActions{padding:0 26px 24px;display:flex;justify-content:flex-end;gap:12px}#modalActions:empty{display:none}.progress{height:4px;background:#cad4e5;margin-top:18px}.progress span{display:block;height:100%;background:var(--blue)}@media(max-width:700px){.title{font-size:16px;padding:16px}.clock{min-width:120px;padding:14px}.clock strong{font-size:23px}.strip{padding:9px 16px}.strip #save{max-width:55%;text-align:right;font-size:11px}main{padding:22px 16px 100px}.intro,.result{padding:24px;margin:0}h1{font-size:24px}.fields{grid-template-columns:1fr}.question{font-size:18px}.option{padding:12px 5px}.option-text{font-size:16px}footer button{padding:17px 15px;font-size:14px}footer .spacer{display:none}footer button:last-child{margin-left:auto}.stats{gap:20px}.review-table td,.review-table th{padding:10px 7px}.review-table button{padding:7px}.tools button{padding:10px 15px}}
</style></head><body><header><div class="title">AWS Certified Solutions Architect - Associate <span>(SAA-C03)</span><small id="student">모의시험</small></div><div class="clock"><span id="timerLabel">PRACTICE EXAM</span><strong id="timer">10문항</strong><span id="position">한국어 · English</span></div></header><div class="strip"><span id="section">시험 안내</span><span id="save">학습용 모의시험 · AWS 공식 시험 아님</span></div><main id="main"></main><footer id="footer"></footer><dialog id="modal" aria-labelledby="modalTitle"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="팝업 닫기">✕</button></div><div id="modalBody"></div><div id="modalActions"></div></dialog><script>const QUESTIONS = [{"id": 1, "ko": {"text": "회사는 AWS Organizations 를 사용하여 여러 부서의 여러 AWS 계정을 관리합니다. 관리 계정에는 프로젝트 보고서가 포함된 Amazon S3 버킷이 있습니다. \n회사는 이 S3 버킷에 대한 액세스를 AWS Organizations 의 조직 내 계정 사용자로만 제한하려고 합니다. 최소한의 운영 오버헤드로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?", "options": [{"key": "A", "text": "Organization ID 에 대한 참조와 함께 aws:PrincipalOrgID 전역 조건 키를 S3 버킷 정책에 추가합니다."}, {"key": "B", "text": "각 부서에 대한 조직 단위(OU)를 만듭니다. aws:PrincipalOrgPaths 전역 조건 키를 S3 버킷 정책에 추가합니다."}, {"key": "C", "text": "AWS CloudTrail 을 사용하여 CreateAccount, InviteAccountToOrganization, LeaveOrganization 및 RemoveAccountFromOrganization 이벤트를 모니터링합니다. 그에 따라 S3 버킷 정책을 업데이트합니다."}, {"key": "D", "text": "S3 버킷에 액세스해야 하는 각 사용자에 태그를 지정합니다. aws:PrincipalTag 전역 조건 키를 S3 버킷 정책에 추가합니다."}]}, "en": {"text": "A company uses AWS Organizations to manage multiple AWS accounts for different departments. \nThe management account has an Amazon S3 bucket that contains project reports. The company wants to limit access to this S3 bucket to only users of accounts within the organization in AWS Organizations. Which solution meets these requirements with the LEAST amount of operational overhead?", "options": [{"key": "A", "text": "Add the aws:PrincipalOrgID global condition key with a reference to the organization ID to the S3 bucket policy."}, {"key": "B", "text": "Create an organizational unit (OU) for each department. Add the aws:PrincipalOrgPaths global condition key to the S3 bucket policy."}, {"key": "C", "text": "Use AWS CloudTrail to monitor the CreateAccount, InviteAccountToOrganization, LeaveOrganization, and RemoveAccountFromOrganization events. Update the S3 bucket policy accordingly."}, {"key": "D", "text": "Tag each user that needs access to the S3 bucket. Add the aws:PrincipalTag global condition key to the S3 bucket policy."}]}, "answer": ["A"]}, {"id": 2, "ko": {"text": "애플리케이션은 VPC 의 Amazon EC2 인스턴스에서 실행됩니다. 애플리케이션은 Amazon S3 버킷에 저장된 로그를 처리합니다. \nEC2 인스턴스는 인터넷 연결 없이 S3 버킷에 액세스해야 합니다. Amazon S3 에 대한 프라이빗 네트워크 연결을 제공하는 솔루션은 무엇입니까?", "options": [{"key": "A", "text": "S3 버킷에 대한 게이트웨이 VPC 엔드포인트를 생성합니다."}, {"key": "B", "text": "Amazon CloudWatch Logs 로 로그를 스트리밍합니다. 로그를 S3 버킷으로 내보냅니다."}, {"key": "C", "text": "Amazon EC2 에 인스턴스 프로파일을 생성하여 S3 액세스를 허용합니다."}, {"key": "D", "text": "S3 엔드포인트에 액세스하기 위한 프라이빗 링크가 있는 Amazon API Gateway API 를 생성합니다."}]}, "en": {"text": "An application runs on an Amazon EC2 instance in a VPC. The application processes logs that are stored in an Amazon S3 bucket. \nThe EC2 instance needs to access the S3 bucket without connectivity to the internet. Which solution will provide private network connectivity to Amazon S3?", "options": [{"key": "A", "text": "Create a gateway VPC endpoint to the S3 bucket."}, {"key": "B", "text": "Stream the logs to Amazon CloudWatch Logs. Export the logs to the S3 bucket."}, {"key": "C", "text": "Create an instance profile on Amazon EC2 to allow S3 access."}, {"key": "D", "text": "Create an Amazon API Gateway API with a private link to access the S3 endpoint."}]}, "answer": ["A"]}, {"id": 3, "ko": {"text": "회사는 사용자 업로드 문서를 Amazon EBS 볼륨에 저장하는 단일 Amazon EC2 인스턴스를 사용하여 AWS 에서 웹 애플리케이션을 호스팅하고 있습니다. \n더 나은 확장성과 가용성을 위해 이 회사는 아키텍처를 복제하고 다른 가용 영역에 두 번째 EC2 인스턴스와 EBS 볼륨을 생성하여 Application Load Balancer 뒤에 배치했습니다. 이 변경을 완료한 후 사용자는 웹 사이트를 새로 고칠 때마다 문서의 일부 또는 다른 하위 집합을 볼 수 있지만 모든 문서를 동시에 볼 수는 없다고 보고했습니다. 솔루션 설계자는 사용자가 모든 문서를 한 번에 볼 수 있도록 무엇을 제안해야 합니까?", "options": [{"key": "A", "text": "두 EBS 볼륨에 모든 문서가 포함되도록 데이터를 복사합니다."}, {"key": "B", "text": "문서가 있는 서버로 사용자를 안내하도록 Application Load Balancer 를 구성합니다."}, {"key": "C", "text": "두 EBS 볼륨의 데이터를 Amazon EFS 로 복사합니다. 새 문서를 Amazon EFS 에 저장하도록 애플리케이션을 수정합니다."}, {"key": "D", "text": "두 서버 모두에 요청을 보내도록 Application Load Balancer 를 구성합니다. 올바른 서버에서 각 문서를 반환합니다."}]}, "en": {"text": "A company is hosting a web application on AWS using a single Amazon EC2 instance that stores user-uploaded documents in an Amazon EBS volume. For better scalability and availability, the company duplicated the architecture and created a second EC2 instance and EBS volume in another Availability Zone, placing both behind an Application Load Balancer. After completing this change, users reported that, each time they refreshed the website, they could see one subset of their documents or the other, but never all of the documents at the same time. What should a solutions architect propose to ensure users see all of their documents at once?", "options": [{"key": "A", "text": "Copy the data so both EBS volumes contain all the documents．"}, {"key": "B", "text": "Configure the Application Load Balancer to direct a user to the server with the documents．"}, {"key": "C", "text": "Copy the data from both EBS volumes to Amazon EFS. Modify the application to save new documents to Amazon EFS．"}, {"key": "D", "text": "Configure the Application Load Balancer to send the request to both servers. Return each document from the correct server．"}]}, "answer": ["C"]}, {"id": 4, "ko": {"text": "회사는 데이터 센터에서 SMB 파일 서버를 실행하고 있습니다. 파일 서버는 파일이 생성된 후 처음 며칠 동안 자주 액세스하는 대용량 파일을 저장합니다. \n7 일이 지나면 파일에 거의 액세스하지 않습니다. 총 데이터 크기가 증가하고 있으며 회사의 총 저장 용량에 가깝습니다. 솔루션 설계자는 가장 최근에 액세스한 파일에 대한 저지연 액세스를 잃지 않으면서 회사의 사용 가능한 저장 공간을 늘려야 합니다. 솔루션 설계자는 향후 스토리지 문제를 방지하기 위해 파일 수명 주기 관리도 제공해야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족합니까?", "options": [{"key": "A", "text": "AWS DataSync 를 사용하여 SMB 파일 서버에서 AWS 로 7 일이 지난 데이터를 복사합니다."}, {"key": "B", "text": "Amazon S3 파일 게이트웨이를 생성하여 회사의 스토리지 공간을 확장합니다. S3 수명 주기 정책을 생성하여 7 일 후에 데이터를 S3 Glacier Deep Archive 로 전환합니다."}, {"key": "C", "text": "Windows 파일 서버용 Amazon FSx 파일 시스템을 생성하여 회사의 저장 공간을 확장합니다."}, {"key": "D", "text": "각 사용자의 컴퓨터에 유틸리티를 설치하여 Amazon S3 에 액세스합니다. S3 수명 주기 정책을 생성하여 7 일 후 데이터를 S3 Glacier Flexible Retrieval 로 전환합니다."}]}, "en": {"text": "A company is running an SMB file server in its data center. The file server stores large files that are accessed frequently for the first few days after the files are created. After 7 days the files are rarely accessed. The total data size is increasing and is close to the company's total storage capacity. A solutions architect must increase the company's available storage space without losing low-latency access to the most recently accessed files. The solutions architect must also provide file lifecycle management to avoid future storage issues. Which solution will meet these requirements?", "options": [{"key": "A", "text": "Use AWS DataSync to copy data that is older than 7 days from the SMB file server to AWS."}, {"key": "B", "text": "Create an Amazon S3 File Gateway to extend the company's storage space. Create an S3 Lifecycle policy to transition the data to S3 Glacier Deep Archive after 7 days."}, {"key": "C", "text": "Create an Amazon FSx for Windows File Server file system to extend the company's storage space."}, {"key": "D", "text": "Install a utility on each user's computer to access Amazon S3. Create an S3 Lifecycle policy to transition the data to S3 Glacier Flexible Retrieval after 7 days."}]}, "answer": ["B"]}, {"id": 5, "ko": {"text": "회사는 AWS 에서 전자 상거래 웹 애플리케이션을 구축하고 있습니다. 애플리케이션은 처리할 Amazon API Gateway REST API 에 새 주문에 대한 정보를 보냅니다. 회사는 주문이 접수된 순서대로 처리되기를 원합니다.\n어떤 솔루션이 이러한 요구 사항을 충족합니까?", "options": [{"key": "A", "text": "API Gateway 통합을 사용하여 애플리케이션이 주문을 수신할 때 Amazon Simple Notification Service(Amazon SNS) 주제에 메시지를 게시합니다. AWS Lambda 함수를 주제에 구독하여 처리를 수행합니다."}, {"key": "B", "text": "API Gateway 통합을 사용하여 애플리케이션이 주문을 수신할 때 Amazon Simple Queue Service(Amazon SQS) FIFO 대기열에 메시지를 보냅니다. 처리를 위해 AWS Lambda 함수를 호출하도록 SQS FIFO 대기열을 구성합니다."}, {"key": "C", "text": "API Gateway 권한 부여자를 사용하여 애플리케이션이 주문을 처리하는 동안 모든 요청을 차단합니다."}, {"key": "D", "text": "API Gateway 통합을 사용하여 애플리케이션이 주문을 수신할 때 Amazon Simple Queue Service(Amazon SQS) 표준 대기열에 메시지를 보냅니다. 처리를 위해 AWS Lambda 함수를 호출하도록 SQS 표준 대기열을 구성합니다."}]}, "en": {"text": "A company is building an ecommerce web application on AWS. The application sends information about new orders to an Amazon API Gateway REST API to process. The company wants to ensure that orders are processed in the order that they are received.\nWhich solution will meet these requirements?", "options": [{"key": "A", "text": "Use an API Gateway integration to publish a message to an Amazon Simple Notification Service (Amazon SNS) topic when the application receives an order. Subscribe an AWS Lambda function\nto the topic to perform processing."}, {"key": "B", "text": "Use an API Gateway integration to send a message to an Amazon Simple Queue Service (Amazon SQS) FIFO queue when the application receives an order. Configure the SQS FIFO queue\nto invoke an AWS Lambda function for processing."}, {"key": "C", "text": "Use an API Gateway authorizer to block any requests while the application processes an order."}, {"key": "D", "text": "Use an API Gateway integration to send a message to an Amazon Simple Queue Service (Amazon SQS) standard queue when the application receives an order. Configure the SQS standard\nqueue to invoke an AWS Lambda function for processing."}]}, "answer": ["B"]}, {"id": 6, "ko": {"text": "글로벌 회사는 ALB(Application Load Balancer) 뒤의 Amazon EC2 인스턴스에서 웹 애플리케이션을 호스팅합니다. 웹 애플리케이션에는 정적 데이터와 동적 데이터가 있습니다.\n회사는 정적 데이터를 Amazon S3 버킷에 저장합니다. 회사는 정적 데이터 및 동적 데이터의 성능을 개선하고 대기 시간을 줄이기를 원합니다. 회사는 Amazon Route 53 에 등록된 자체 도메인 이름을 사용하고 있습니다.\n솔루션 설계자는 이러한 요구 사항을 충족하기 위해 무엇을 해야 합니까?", "options": [{"key": "A", "text": "S3 버킷과 ALB 를 오리진으로 포함하는 Amazon CloudFront 배포를 생성합니다. CloudFront 배포로 트래픽을 라우팅하도록 Route 53 을 구성합니다."}, {"key": "B", "text": "ALB 가 오리진인 Amazon CloudFront 배포를 생성합니다. S3 버킷을 엔드포인트로 포함하는 AWS Global Accelerator 표준 액셀러레이터를 생성합니다. CloudFront 배포로 트래픽을 라우팅하도록 Route 53 을 구성합니다."}, {"key": "C", "text": "S3 버킷을 오리진으로 포함하는 Amazon CloudFront 배포를 생성합니다. ALB 및 CloudFront 배포를 엔드포인트로 포함하는 AWS Global Accelerator 표준 액셀러레이터를 생성합니다. 가속기\nDNS 이름을 가리키는 사용자 지정 도메인 이름을 만듭니다. 사용자 지정 도메인 이름을 웹 애플리케이션의 끝점으로 사용합니다."}, {"key": "D", "text": "ALB 가 오리진인 Amazon CloudFront 배포를 생성합니다. S3 버킷을 엔드포인트로 포함하는 AWS Global Accelerator 표준 액셀러레이터를 생성합니다. 두 개의 도메인 이름을 만듭니다.\n하나의 도메인 이름이 동적 콘텐츠의 CloudFront DNS 이름을 가리키도록 합니다. 다른 도메인 이름이 정적 콘텐츠에 대한 가속기 DNS 이름을 가리키도록 합니다. 도메인 이름을 웹 애플리케이션의 끝점으로 사용합니다."}]}, "en": {"text": "A global company hosts its web application on Amazon EC2 instances behind an Application Load Balancer (ALB). The web application has static data and dynamic data. The company stores its\nstatic data in an Amazon S3 bucket. The company wants to improve performance and reduce latency for the static data and dynamic data. The company is using its own domain name registered\nwith Amazon Route 53.\nWhat should a solutions architect do to meet these requirements?", "options": [{"key": "A", "text": "Create an Amazon CloudFront distribution that has the S3 bucket and the ALB as origins. Configure Route 53 to route traffic to the CloudFront distribution."}, {"key": "B", "text": "Create an Amazon CloudFront distribution that has the ALB as an origin. Create an AWS Global Accelerator standard accelerator that has the S3 bucket as an endpoint Configure Route 53 to route traffic to the CloudFront distribution."}, {"key": "C", "text": "Create an Amazon CloudFront distribution that has the S3 bucket as an origin. Create an AWS Global Accelerator standard accelerator that has the ALB and the CloudFront distribution as endpoints. Create a custom domain name that points to the accelerator DNS name. Use the custom domain name as an endpoint for the web application."}, {"key": "D", "text": "Create an Amazon CloudFront distribution that has the ALB as an origin. Create an AWS Global Accelerator standard accelerator that has the S3 bucket as an endpoint. Create two domain names. Point one domain name to the CloudFront DNS name for dynamic content. Point the other domain name to the accelerator DNS name for static content. Use the domain names as endpoints for the\nweb application."}]}, "answer": ["A"]}, {"id": 7, "ko": {"text": "애플리케이션 개발 팀은 큰 이미지를 더 작은 압축 이미지로 변환하는 마이크로서비스를 설계하고 있습니다. 사용자가 웹 인터페이스를 통해 이미지를 업로드하면 마이크로 서비스는 이미지를 Amazon S3 버킷에 저장하고, AWS Lambda 함수로 이미지를 처리 및 압축하고, 다른 S3 버킷에 압축된 형태로 이미지를 저장해야 합니다.\n솔루션 설계자는 내구성이 있는 상태 비저장 구성 요소를 사용하여 이미지를 자동으로 처리하는 솔루션을 설계해야 합니다.\n이러한 요구 사항을 충족하는 작업 조합은 무엇입니까? (2 개를 선택하세요.)", "options": [{"key": "A", "text": "Amazon Simple Queue Service(Amazon SQS) 대기열을 생성합니다. 이미지가 S3 버킷에 업로드될 때 SQS 대기열에 알림을 보내도록 S3 버킷을 구성합니다."}, {"key": "B", "text": "Amazon Simple Queue Service(Amazon SQS) 대기열을 호출 소스로 사용하도록 Lambda 함수를 구성합니다. SQS 메시지가 성공적으로 처리되면 대기열에서 메시지를 삭제합니다."}, {"key": "C", "text": "새 업로드에 대해 S3 버킷을 모니터링하도록 Lambda 함수를 구성합니다. 업로드된 이미지가 감지되면 메모리의 텍스트 파일에 파일 이름을 쓰고 텍스트 파일을 사용하여 처리된 이미지를 추적합니다."}, {"key": "D", "text": "Amazon EC2 인스턴스를 시작하여 Amazon Simple Queue Service(Amazon SQS) 대기열을 모니터링합니다. 항목이 대기열에 추가되면 EC2 인스턴스의 텍스트 파일에 파일 이름을 기록하고 Lambda 함수를 호출합니다."}, {"key": "E", "text": "Amazon EventBridge(Amazon CloudWatch Events) 이벤트를 구성하여 S3 버킷을 모니터링합니다. 이미지가 업로드되면 추가 처리를 위해 애플리케이션 소유자의 이메일 주소와 함께 Amazon Simple Notification Service(Amazon SNS) 주제에 알림을 보냅니다."}]}, "en": {"text": "An application development team is designing a microservice that will convert large images to smaller, compressed images. When a user uploads an image through the web interface, the\nmicroservice should store the image in an Amazon S3 bucket, process and compress the image with an AWS Lambda function, and store the image in its compressed form in a different S3 bucket.\nA solutions architect needs to design a solution that uses durable, stateless components to process the images automatically.\nWhich combination of actions will meet these requirements? (Choose two.)", "options": [{"key": "A", "text": "Create an Amazon Simple Queue Service (Amazon SQS) queue. Configure the S3 bucket to send a notification to the SQS queue when an image is uploaded to the S3 bucket."}, {"key": "B", "text": "Configure the Lambda function to use the Amazon Simple Queue Service (Amazon SQS) queue as the invocation source. When the SQS message is successfully processed, delete the message\nin the queue."}, {"key": "C", "text": "Configure the Lambda function to monitor the S3 bucket for new uploads. When an uploaded image is detected, write the file name to a text file in memory and use the text file to keep track of\nthe images that were processed."}, {"key": "D", "text": "Launch an Amazon EC2 instance to monitor an Amazon Simple Queue Service (Amazon SQS) queue. When items are added to the queue, log the file name in a text file on the EC2 instance and\ninvoke the Lambda function."}, {"key": "E", "text": "Configure an Amazon EventBridge (Amazon CloudWatch Events) event to monitor the S3 bucket. When an image is uploaded, send an alert to an Amazon Simple Notification Service (Amazon SNS)\ntopic with the application owner's email address for further processing."}]}, "answer": ["A", "B"]}, {"id": 8, "ko": {"text": "솔루션 설계자는 회사가 AWS 에서 애플리케이션을 실행하는 비용을 최적화할 수 있도록 도와야 합니다. 애플리케이션은 아키텍처 내 컴퓨팅을 위해 Amazon EC2 인스턴스, AWS Fargate 및 AWS Lambda 를 사용합니다.\nEC2 인스턴스는 애플리케이션의 데이터 수집 계층을 실행합니다. EC2 사용은 산발적이고 예측할 수 없습니다. EC2 인스턴스에서 실행되는 워크로드는 언제든지 중단될 수 있습니다. 애플리케이션 프런트 엔드는 Fargate 에서 실행되고 Lambda 는 API 계층을 제공합니다. 프론트엔드 활용도와 API 계층 활용도는 내년에 예측할 수 있습니다.\n이 애플리케이션을 호스팅하는 데 가장 비용 효율적인 솔루션을 제공하는 구매 옵션 조합은 무엇입니까? (2 개 선택)", "options": [{"key": "A", "text": "데이터 수집 계층에 스팟 인스턴스 사용"}, {"key": "B", "text": "데이터 수집 계층에 온디맨드 인스턴스 사용"}, {"key": "C", "text": "프런트 엔드 및 API 계층에 대한 1 년 Compute Savings Plan 을 구매합니다."}, {"key": "D", "text": "데이터 수집 계층에 대한 1 년 전체 선결제 예약 인스턴스를 구매합니다."}, {"key": "E", "text": "프런트 엔드 및 API 계층을 위한 1 년 EC2 인스턴스 Savings Plan 을 구매합니다."}]}, "en": {"text": "A solutions architect needs to help a company optimize the cost of running an application on AWS.\nThe application will use Amazon EC2 instances, AWS Fargate, and AWS Lambda for compute within the architecture.\nThe EC2 instances will run the data ingestion layer of the application. EC2 usage will be sporadic and unpredictable. Workloads that run on EC2 instances can be interrupted at any time. The application front end will run on Fargate, and Lambda will serve the API layer. The front-end utilization and API layer utilization will be predictable over the course of the next year.\nWhich combination of purchasing options will provide the MOST cost-effective solution for hosting this application? (Choose two)", "options": [{"key": "A", "text": "Use Spot Instances for the data ingestion layer"}, {"key": "B", "text": "Use On-Demand Instances for the data ingestion layer"}, {"key": "C", "text": "Purchase a 1-year Compute Savings Plan for the front end and API layer."}, {"key": "D", "text": "Purchase 1-year All Upfront Reserved instances for the data ingestion layer."}, {"key": "E", "text": "Purchase a 1-year EC2 instance Savings Plan for the front end and API layer."}]}, "answer": ["A", "C"]}, {"id": 9, "ko": {"text": "회사의 애플리케이션에 성능 문제가 있습니다. 애플리케이션은 상태 저장이며 Amazon EC2 인스턴스에서 인 메모리 작업을 완료해야 합니다. 이 회사는 AWS CloudFormation 을 사용하여 인프라를 배포하고 M5 EC2 인스턴스 제품군을 사용했습니다. 트래픽이 증가함에 따라 애플리케이션 성능이 저하되었습니다. 사용자는 사용자가 애플리케이션에 액세스하려고 할 때 지연을 보고합니다.\n운영상 가장 효율적인 방식으로 이러한 문제를 해결하는 솔루션은 무엇입니까?", "options": [{"key": "A", "text": "Auto Scaling 그룹에서 실행되는 T3 EC2 인스턴스로 EC2 인스턴스를 교체합니다. AWS Management Console 을 사용하여 변경합니다."}, {"key": "B", "text": "Auto Scaling 그룹에서 EC2 인스턴스를 실행하도록 CloudFormation 템플릿을 수정합니다. 증가가 필요한 경우 Auto Scaling 그룹의 원하는 용량과 최대 용량을 수동으로 늘립니다."}, {"key": "C", "text": "CloudFormation 템플릿을 수정합니다. EC2 인스턴스를 R5 EC2 인스턴스로 교체합니다. Amazon CloudWatch 내장 EC2 메모리 메트릭을 사용하여 향후 용량 계획을 위해 애플리케이션 성능을 추적합니다."}, {"key": "D", "text": "CloudFormation 템플릿을 수정합니다. EC2 인스턴스를 R5 EC2 인스턴스로 교체합니다. EC2 인스턴스에 Amazon CloudWatch 에이전트를 배포하여 향후 용량 계획을 위한 사용자 지정 애플리케이션 지연 시간 메트릭을 생성합니다."}]}, "en": {"text": "A company’s application is having performance issues. The application is stateful and needs to complete in-memory tasks on Amazon EC2 instances. The company used AWS CloudFormation to deploy infrastructure and used the M5 EC2 instance family. As traffic increased, the application performance degraded. Users are reporting delays when the users attempt to access the application.\nWhich solution will resolve these issues in the MOST operationally efficient way?", "options": [{"key": "A", "text": "Replace the EC2 instances with T3 EC2 instances that run in an Auto Scaling group. Make the changes by using the AWS Management Console."}, {"key": "B", "text": "Modify the CloudFormation templates to run the EC2 instances in an Auto Scaling group. Increase the desired capacity and the maximum capacity of the Auto Scaling group manually when\nan increase is necessary."}, {"key": "C", "text": "Modify the CloudFormation templates. Replace the EC2 instances with R5 EC2 instances. Use Amazon CloudWatch built-in EC2 memory metrics to track the application performance for future\ncapacity planning."}, {"key": "D", "text": "Modify the CloudFormation templates. Replace the EC2 instances with R5 EC2 instances. Deploy the Amazon CloudWatch agent on the EC2 instances to generate custom application latency metrics for future capacity planning."}]}, "answer": ["D"]}, {"id": 10, "ko": {"text": "회사는 Amazon Linux EC2 인스턴스 그룹에서 애플리케이션을 실행합니다. 규정 준수를 위해 회사는 모든 애플리케이션 로그 파일을 7 년 동안 보관해야 합니다. 로그 파일은 모든 파일에 동시에 액세스할 수 있어야 하는 보고 도구로 분석됩니다.\n이러한 요구 사항을 가장 비용 효율적으로 충족하는 스토리지 솔루션은 무엇입니까?", "options": [{"key": "A", "text": "Amazon Elastic Block Store(Amazon EBS)"}, {"key": "B", "text": "Amazon Elastic File System(Amazon EFS)"}, {"key": "C", "text": "Amazon EC2 인스턴스 스토어"}, {"key": "D", "text": "Amazon S3"}]}, "en": {"text": "A company runs an application on a group of Amazon Linux EC2 instances. For compliance reasons,\nthe company must retain all application log files for 7 years. The log files will be analyzed by a reporting tool that must be able to access all the files concurrently.\nWhich storage solution meets these requirements MOST cost-effectively?", "options": [{"key": "A", "text": "Amazon Elastic Block Store (Amazon EBS)"}, {"key": "B", "text": "Amazon Elastic File System (Amazon EFS)"}, {"key": "C", "text": "Amazon EC2 instance store"}, {"key": "D", "text": "Amazon S3"}]}, "answer": ["D"]}];</script><script>'use strict';
const KEY='saa-hyunjung-exam-v1', $=id=>document.getElementById(id), main=$('main'), footer=$('footer'), modal=$('modal');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null, storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&typeof s.name==='string'&&Number.isFinite(s.deadline)&&Number.isFinite(s.started)&&Number.isInteger(s.index)&&s.index>=0&&s.index<10&&Array.isArray(s.answers)&&s.answers.length===10&&s.answers.every((a,i)=>Array.isArray(a)&&a.every(k=>QUESTIONS[i].ko.options.some(o=>o.key===k)))&&Array.isArray(s.flags)&&s.flags.length===10&&['exam','review','result'].includes(s.view))state=s;}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}$('save').textContent=storageOK?'답안 자동 저장됨 · 이 브라우저에 저장':'저장 불가 · 창을 닫으면 답안이 사라질 수 있습니다';}
function complete(i){return state.answers[i].length===QUESTIONS[i].answer.length;}
function count(){return state.answers.filter((_,i)=>complete(i)).length;}
function close(){modal.close();}
$('closeModal').onclick=close;
function popup(title,body,actions=''){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=actions;if(!modal.open)modal.showModal();}
function intro(){state=null;$('student').textContent='모의시험';$('section').textContent='시험 안내';$('timerLabel').textContent='PRACTICE EXAM';$('timer').textContent='10문항';$('position').textContent='한국어 · English';footer.innerHTML='<span class="spacer">AWS SAA-C03 · 학습용 모의시험</span>';main.innerHTML=`<section class="intro"><div class="eyebrow">CERTIFICATION PRACTICE</div><h1>AWS Certified Solutions Architect - Associate <span style="white-space:nowrap">(SAA-C03)</span></h1><p class="muted">이름을 입력하고 모의시험을 시작하세요.<br>답안은 제출 전까지 자유롭게 변경할 수 있습니다.</p><div class="stats"><div><strong>10</strong><span>전체 문항</span></div><div><strong>8 + 2</strong><span>단일 선택 + 복수 선택</span></div><div><strong>KO / EN</strong><span>문제 언어</span></div></div><form id="startForm"><div class="fields"><label class="field">응시자 이름<input id="name" type="text" maxlength="60" placeholder="이름을 입력하세요" required autocomplete="name"></label><label class="field">제한 시간<select id="duration"><option value="20" selected>20분</option><option value="30">30분</option><option value="60">60분</option><option value="130">130분</option></select></label></div><button class="primary" type="submit">모의시험 시작 →</button></form><p class="note">• English 버튼으로 영어 원문과 보기를 확인할 수 있습니다.<br>• 복수 선택 문항은 정답을 모두 맞혀야 점수가 부여됩니다.<br>• 시간이 끝나면 현재 답안으로 자동 제출됩니다. 창을 닫아도 시간은 계속 흐릅니다.<br>• 각 문항 10점, 총 100점이며 공식 AWS 시험 점수와는 다릅니다.</p></section>`;$('startForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name){$('name').setCustomValidity('이름을 입력하세요.');$('name').reportValidity();return;}const now=Date.now();state={version:1,name,index:0,answers:QUESTIONS.map(()=>[]),flags:QUESTIONS.map(()=>false),started:now,deadline:now+Number($('duration').value)*60000,view:'exam',submitted:null};save();render();};$('name').oninput=()=>$('name').setCustomValidity('');}
function navigate(view,index=state.index){if(state.submitted)return;state.view=view;state.index=index;save();render();window.scrollTo(0,0);}
function header(){ $('student').textContent=state.name;$('section').textContent=state.view==='review'?'검토 화면':state.view==='result'?'시험 결과':'설명(M)';$('position').textContent=state.view==='exam'?`${state.index+1} / 10`:`${count()} / 10 답변 완료`;}
function exam(){const q=QUESTIONS[state.index],multi=q.answer.length>1;main.innerHTML=`<div class="tools"><button class="english" id="english">English</button><span class="question-title">문제 ${q.id} / 10</span><label class="flag"><input type="checkbox" id="flag" ${state.flags[state.index]?'checked':''}>검토 표시</label></div><div class="question">${esc(q.ko.text)}</div><fieldset class="choices"><legend>${multi?'2개를 선택하세요.':'1개를 선택하세요.'}</legend>${q.ko.options.map(o=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="answer" value="${o.key}" ${state.answers[state.index].includes(o.key)?'checked':''}><span class="option-text"><span class="letter">${o.key}.</span>${esc(o.text)}</span></label>`).join('')}</fieldset><div class="question-bottom"><span id="selection"></span><button id="clear">선택 지우기</button></div><div class="progress" aria-hidden="true"><span style="width:${(state.index+1)*10}%"></span></div>`;footer.innerHTML=`<button id="review">검토화면(S)</button><span class="spacer">${count()} / 10 답변 완료</span><button id="previous" ${state.index===0?'disabled':''}>← 이전(P)</button><button id="next">${state.index===9?'검토하기 →':'다음(N) →'}</button>`;
function status(){$('selection').textContent=`${state.answers[state.index].length} / ${q.answer.length}개 선택`;$('position').textContent=`${state.index+1} / 10`;footer.querySelector('.spacer').textContent=`${count()} / 10 답변 완료`;}
main.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(!active())return;if(multi){const selected=[...main.querySelectorAll('input[name=answer]:checked')].map(x=>x.value);if(selected.length>q.answer.length){el.checked=false;popup('선택 개수 확인','이 문항은 2개까지 선택할 수 있습니다. 다른 보기를 선택하려면 기존 선택을 해제하세요.');return;}state.answers[state.index]=selected;}else state.answers[state.index]=[el.value];save();status();});$('flag').onchange=e=>{if(!active())return;state.flags[state.index]=e.target.checked;save();};$('clear').onclick=()=>{if(!active())return;state.answers[state.index]=[];save();exam();};$('english').onclick=()=>popup(`Question ${q.id} · English`,`<div lang="en"><p>${esc(q.en.text)}</p>${q.en.options.map(o=>`<p><b>${o.key}.</b> ${esc(o.text)}</p>`).join('')}</div>`);$('review').onclick=()=>navigate('review');$('previous').onclick=()=>navigate('exam',state.index-1);$('next').onclick=()=>navigate(state.index===9?'review':'exam',Math.min(9,state.index+1));status();}
function review(){main.innerHTML=`<h1>답안 검토</h1><p class="muted">답변 여부를 확인하고 문항 번호를 눌러 다시 확인하세요. 제출하면 답안을 변경할 수 없습니다.</p><div class="review-summary"><span class="pill">전체 10문항</span><span class="pill answered">답변 완료 ${count()}</span><span class="pill unanswered">미완료 ${10-count()}</span><span class="pill">검토 표시 ${state.flags.filter(Boolean).length}</span></div><table class="review-table"><thead><tr><th>문항</th><th>유형</th><th>내 선택</th><th>답변 상태</th><th>검토</th></tr></thead><tbody>${QUESTIONS.map((q,i)=>`<tr><td><button data-question="${i}">문제 ${q.id} ↗</button></td><td>${q.answer.length===1?'단일':'복수 (2개)'}</td><td>${state.answers[i].join(', ')||'—'}</td><td class="${complete(i)?'answered':'unanswered'}">${complete(i)?'답변 완료':state.answers[i].length?'선택 미완료':'미응답'}</td><td>${state.flags[i]?'⚑ 검토':'—'}</td></tr>`).join('')}</tbody></table>`;main.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>navigate('exam',Number(b.dataset.question)));footer.innerHTML='<button id="back">← 문제로 돌아가기</button><span class="spacer">제출 전까지 답안을 수정할 수 있습니다.</span><button id="submit">시험 종료 / 제출 →</button>';$('back').onclick=()=>navigate('exam');$('submit').onclick=()=>{if(!active())return;popup('시험을 제출하시겠습니까?',`답변 완료: ${count()} / 10문항\n${count()<10?'미응답 또는 선택 미완료 문항은 오답 처리됩니다.\n':''}제출 후에는 답안을 수정할 수 없습니다.`, '<button id="cancelSubmit">계속 검토</button><button class="primary" id="confirmSubmit">제출하고 점수 확인</button>');$('cancelSubmit').onclick=close;$('confirmSubmit').onclick=()=>finish(false);};}
function active(){if(state.submitted)return false;if(Date.now()>=state.deadline){finish(true);return false;}return true;}
function finish(timed){if(state.submitted)return;state.submitted=Math.min(Date.now(),state.deadline);state.timed=timed;state.view='result';close();save();render();}
function grade(answers){return QUESTIONS.reduce((n,q,i)=>n+(answers[i].length===q.answer.length&&q.answer.every(k=>answers[i].includes(k))?1:0),0);}
function results(){const correct=grade(state.answers),seconds=Math.max(0,Math.floor((state.submitted-state.started)/1000));main.innerHTML=`<section class="result"><div class="eyebrow">EXAM COMPLETED</div><h1>${esc(state.name)} 님의 시험 결과</h1><p class="muted">${state.timed?'제한 시간이 종료되어 자동 제출되었습니다.':'답안 제출이 완료되었습니다.'}</p><div class="score">${correct*10}<small> / 100점</small></div><div class="result-grid"><div><strong>${correct}</strong><span>정답</span></div><div><strong>${10-correct}</strong><span>오답 · 미완료</span></div><div><strong>${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</strong><span>소요 시간</span></div></div><p class="note">문항별 10점 · 복수 선택은 모두 일치해야 정답<br>학습용 단순 점수이며 AWS 공식 시험의 환산 점수가 아닙니다.</p><button class="primary" id="restart">다시 응시하기</button></section>`;footer.innerHTML='<span class="spacer">AWS Certified Solutions Architect - Associate (SAA-C03) · 모의시험</span>';$('restart').onclick=()=>{popup('새 시험 시작','새 시험을 시작하면 이 브라우저에 저장된 이전 응시 기록이 지워집니다.','<button id="keep">취소</button><button class="primary" id="reset">새 시험 시작</button>');$('keep').onclick=close;$('reset').onclick=()=>{close();try{localStorage.removeItem(KEY);}catch(e){}intro();tick();};};}
function tick(){if(!state)return;const done=!!state.submitted;const sec=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));$('timerLabel').textContent=done?'EXAM COMPLETED':'남은 시간';$('timer').textContent=done?'제출 완료':`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;document.querySelector('.clock').classList.toggle('urgent',!done&&sec<=60);if(!done&&sec===0)finish(true);}
function render(){header();if(state.submitted)state.view='result';if(state.view==='exam')exam();else if(state.view==='review')review();else results();tick();}
if(state){if(state.submitted)state.view='result';save();render();}else intro();setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
</script></body></html>
